name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test & Deploy to MonsterASP.NET
    runs-on: ubuntu-latest
    env:
      # Clave pública del servidor (ssh-keyscan). No es secreta.
      SFTP_HOST_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGXHt3StlKuaaewYkw6gJUy41XlfjSGxFLEkpNhJYvcm"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build

      - name: Publish web application
        run: dotnet publish Gtrack.csproj -c Release -o ./publish

      - name: Generate appsettings.Production.json
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          jq -n \
            --arg conn "$DB_CONNECTION_STRING" \
            --arg user "$EMAIL_USER" \
            --arg pass "$EMAIL_PASSWORD" \
            --arg from "$EMAIL_FROM" \
            '{
              ConnectionStrings: { GtrackDb: $conn },
              Email: {
                Host: "smtp-relay.brevo.com",
                Port: "587",
                User: $user,
                Password: $pass,
                From: $from,
                NombreRemitente: "GTrack"
              }
            }' > ./publish/appsettings.Production.json

      - name: Prepare SFTP (install lftp and pin host key)
        env:
          MONSTER_FTP_SERVER: ${{ secrets.MONSTER_FTP_SERVER }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          mkdir -p ~/.ssh
          echo "$MONSTER_FTP_SERVER $SFTP_HOST_KEY" > ~/.ssh/known_hosts_monster

          cat > /tmp/lftp_base.rc << EOF
          set sftp:connect-program "ssh -a -x -o UserKnownHostsFile=$HOME/.ssh/known_hosts_monster -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519"
          set net:max-retries 2
          set net:timeout 30
          set cmd:fail-exit yes
          EOF

      - name: Put application offline (upload app_offline.htm)
        env:
          MONSTER_FTP_SERVER: ${{ secrets.MONSTER_FTP_SERVER }}
          MONSTER_FTP_USER: ${{ secrets.MONSTER_FTP_USER }}
          MONSTER_FTP_PASSWORD: ${{ secrets.MONSTER_FTP_PASSWORD }}
        run: |
          cat << 'EOF' > app_offline.htm
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="utf-8" />
              <title>Sitio en mantenimiento - GTrack</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px; background-color: #f8f9fa; color: #333; }
                  h1 { font-size: 2rem; margin-bottom: 10px; color: #0d6efd; }
                  p { font-size: 1.1rem; color: #6c757d; }
              </style>
          </head>
          <body>
              <h1>GTrack se está actualizando</h1>
              <p>Estamos desplegando una nueva versión. El servicio se restablecerá en unos instantes.</p>
          </body>
          </html>
          EOF

          lftp -u "$MONSTER_FTP_USER,$MONSTER_FTP_PASSWORD" \
            -e "source /tmp/lftp_base.rc; put -O /wwwroot app_offline.htm; bye" \
            "sftp://$MONSTER_FTP_SERVER"

          sleep 5

      - name: Deploy to MonsterASP.NET via SFTP
        env:
          MONSTER_FTP_SERVER: ${{ secrets.MONSTER_FTP_SERVER }}
          MONSTER_FTP_USER: ${{ secrets.MONSTER_FTP_USER }}
          MONSTER_FTP_PASSWORD: ${{ secrets.MONSTER_FTP_PASSWORD }}
        run: |
          lftp -u "$MONSTER_FTP_USER,$MONSTER_FTP_PASSWORD" \
            -e "source /tmp/lftp_base.rc; mirror -R --parallel=4 ./publish /wwwroot; bye" \
            "sftp://$MONSTER_FTP_SERVER"

      - name: Remove app_offline.htm (bring app back online)
        if: always()
        env:
          MONSTER_FTP_SERVER: ${{ secrets.MONSTER_FTP_SERVER }}
          MONSTER_FTP_USER: ${{ secrets.MONSTER_FTP_USER }}
          MONSTER_FTP_PASSWORD: ${{ secrets.MONSTER_FTP_PASSWORD }}
        run: |
          lftp -u "$MONSTER_FTP_USER,$MONSTER_FTP_PASSWORD" \
            -e "source /tmp/lftp_base.rc; rm -f /wwwroot/app_offline.htm; bye" \
            "sftp://$MONSTER_FTP_SERVER"
